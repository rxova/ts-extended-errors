packages:
  - packages/*
  - apps/*
allowBuilds:
  esbuild: true
  sharp: true

# GHSA-2m5v-pch6-74hx, GHSA-qrxm-fqhp-jwvm and two siblings: undici below 8.12.2
# drops TLS options in Agent (certificate validation bypass), mishandles TLS 1.2
# renegotiation and excessive content-encodings (DoS), and poisons its cache
# across cross-origin redirects. All high, so `audit:check` turns main red.
# Reached only through unifont > astro in the docs build, which pins an older 8.x
# and has no release to bump to. Drop once astro depends on >=8.12.2 itself.
overrides:
  undici: ">=8.12.2 <9"

# The advisory lookup in `audit:check` is the one request whose answer is
# optional, and pnpm's defaults (60s timeout, two retries) turn a registry outage
# into minutes of waiting. One short retry is enough. These are pnpm settings, so
# they live here: pnpm only reads npm-compatible keys from .npmrc.
fetchTimeout: 15000
fetchRetries: 1
fetchRetryMintimeout: 5000
fetchRetryMaxtimeout: 10000

# The release-age quarantine holds a freshly published version back for a day, to
# blunt supply-chain attacks on packages nobody here controls. @rxova/brand and
# @rxova/astro-ui (from rxova/rxova-website) and @rxova/repo-config,
# @rxova/ts-utils and @rxova/docs-kit (from rxova/shared) are ours, so waiting
# one out only delays our own changes — and without the exclusion `pnpm install` refuses the lockfile
# outright on the day of a bump.
#
# By name rather than by version, matching rxova/rxova-website: `pnpm add` writes
# the exact version if you let it, which leaves a line that means nothing a day
# later and has to be renewed at every release.
minimumReleaseAgeExclude:
  - "@rxova/brand"
  - "@rxova/astro-ui"
  - "@rxova/docs-kit"
  - "@rxova/repo-config"
  - "@rxova/ts-utils"
