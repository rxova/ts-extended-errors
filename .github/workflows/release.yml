name: Release

# Runs only after CI has gone green on main, so nothing publishes that a pull
# request would have been blocked on. changesets/action opens a
# `chore: version packages` pull request and publishes only once that pull
# request is merged — a bad bump is visible before it is in the registry.
#
# Publishes @rxova/ts-extended-errors to GitHub Packages with this workflow's
# GITHUB_TOKEN, so there is no secret to store. Publishing is opt-in: until the
# repository variable RELEASE_ENABLED is `true`, this job is skipped.
#
# A pull request opened with GITHUB_TOKEN starts no workflows, so CI does not
# run on the version pull request by itself. Close and reopen it to run the
# required check.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    # workflow_run fires on failure as well, so the conclusion is checked.
    if: >-
      vars.RELEASE_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The version commit would otherwise fire the pre-commit hook. CI already
      # gated this code on the pull request.
      HUSKY: '0'
    permissions:
      contents: write # version commit and tags
      pull-requests: write # the version pull request
      packages: write # publish to GitHub Packages
    steps:
      - uses: actions/checkout@v7
        with:
          # By name, not the workflow_run's detached SHA, so the action knows
          # its base branch when it opens the version pull request.
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile

      # Only the @rxova scope goes to GitHub Packages; every other dependency
      # still resolves from npmjs. The file names the variable, not the token.
      - name: Authenticate to GitHub Packages
        run: |
          echo '@rxova:registry=https://npm.pkg.github.com' >> ~/.npmrc
          echo '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' >> ~/.npmrc

      - name: Create version PR or publish
        uses: changesets/action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-script: pnpm exec changeset version
          # Builds the library, then `changeset publish`.
          publish-script: pnpm run release
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
