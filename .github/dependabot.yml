version: 2

# Weekly, one grouped pull request per ecosystem, at most one open at a time —
# each Dependabot PR is a CI run, and CI runs are billed here. No custom labels:
# Dependabot's defaults (`dependencies` plus the ecosystem) are created for you,
# whereas a custom label that does not exist in the repository is dropped.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-all:
        applies-to: version-updates
        patterns: ['*']
      npm-security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # typescript-eslint lags a TypeScript major.
      - dependency-name: typescript
        versions: ['>=7']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions-all:
        applies-to: version-updates
        patterns: ['*']
      actions-security:
        applies-to: security-updates
        patterns: ['*']
